name: Verify complete macOS invitation installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test dependencies and official Codex CLI
        run: |
          python3 -m pip install cryptography==46.0.3
          npm install --global @openai/codex@0.161.0
          codex --version
      - name: Test authenticated installation, update, cache and offline MCP
        env:
          BAIYI_INVITE_CODE: ${{ secrets.BAIYI_INVITE_CODE }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B ci/verify_full_macos_install.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-install-report-${{ matrix.os }}
          path: ci-reports/*.json
          if-no-files-found: warn
          retention-days: 14
