name: Build Intel macOS compatibility runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-compat-runtime:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build API23 compatibility runtime with official ORT 1.23.2
        shell: bash
        run: bash ci/build-fast-intel-runtime.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baiyi-numa-darwin-x64-api23-runtime
          path: intel-fast-runtime-output/
          if-no-files-found: error
          retention-days: 7
