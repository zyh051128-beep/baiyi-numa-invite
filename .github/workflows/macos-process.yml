name: Diagnose macOS child process cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -B ci/probe_macos_process_groups.py
